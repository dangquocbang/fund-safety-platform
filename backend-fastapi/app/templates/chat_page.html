<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Safety Chat - Scan #{{ scan_id }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>
    <header class="topbar">
        <div>
            <a class="brand" href="/ui/dashboard">Zalopay Fund Safety Agent</a>
            <span class="badge">Claw (a) thon</span>
        </div>
        <nav>
            <a href="/ui/dashboard">Dashboard</a>
            <a href="/ui/scans/{{ scan_id }}">Scan #{{ scan_id }}</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main class="chat-main">
        <div class="chat-container">
            <!-- Chat header -->
            <div class="chat-header">
                <div class="header-left">
                    <h1>Fund Safety Chat</h1>
                    <p class="scan-info">Scan #{{ scan_id }} - {{ project_name }}</p>
                </div>
                <div class="header-right">
                    <button class="btn btn-secondary" id="clearBtn" title="Clear chat history">
                        <span>🗑️ Clear History</span>
                    </button>
                    <a href="/ui/scans/{{ scan_id }}" class="btn btn-primary">Back to Scan</a>
                </div>
            </div>

            <!-- Messages area -->
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <h2>Welcome to Fund Safety Chat</h2>
                    <p>Ask questions about this scan's assessment, functions, and safety rules.</p>
                    <div class="example-questions">
                        <p><strong>Try asking:</strong></p>
                        <ul id="exampleQuestions"></ul>
                    </div>
                </div>
            </div>

            <!-- Input area -->
            <div class="chat-input-wrapper">
                <div class="chat-input-area">
                    <input
                        id="chatInput"
                        class="chat-input"
                        type="text"
                        placeholder="Ask about fund safety, functions, rules..."
                        autocomplete="off"
                        disabled
                    />
                    <button id="sendBtn" class="btn btn-send" disabled>
                        <span>Send</span>
                    </button>
                </div>
                <div class="input-hint" id="inputHint"></div>
            </div>
        </div>
    </main>

    <!-- Loading template -->
    <template id="loadingTemplate">
        <div class="message ai-message loading">
            <div class="loading-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </template>

    <!-- Scripts -->
    <script>
        const SCAN_ID = {{ scan_id }};
        const ASSESSMENT = {{ assessment | tojson }};
        const EXAMPLE_FUNCTIONS = [
            {% for method in example_methods %}
            "Why {{ method.method_name }} fails?",
            {% endfor %}
        ];
    </script>
    <script src="/static/js/chat.js"></script>
</body>
</html>
